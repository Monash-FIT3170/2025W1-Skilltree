name: ESLint Check

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: ESLint Report
        if: failure()
        run: npm run lint --fix
